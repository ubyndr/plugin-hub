line-length = 96
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",
  "E501",    # long lines are URLs and messages; wrapping them hurts more than it helps
]

[lint.per-file-ignores]
"**/tests/**" = ["S101"]

[lint.isort]
known-first-party = ["plugin_hub"]
